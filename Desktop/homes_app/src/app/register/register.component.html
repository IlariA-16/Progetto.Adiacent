<div class="register-container">
  <div class="register-card">
    <h2>Crea il tuo Account</h2>
    <p>Compila i campi sottostanti per registrarti a Homes</p>

    <!-- Aggiunto (ngSubmit) per gestire l'invio del form -->
    <form (ngSubmit)="registrati()">
      <div class="form-group">
        <label>NOME:</label>
        <input type="text" name="nome" [(ngModel)]="userData.nome" placeholder="Inserisci il tuo nome" required>
      </div>

      <div class="form-group">
        <label>COGNOME:</label>
        <input type="text" name="cognome" [(ngModel)]="userData.cognome" placeholder="Inserisci il tuo cognome" required>
      </div>

      <div class="form-group">
        <label>EMAIL:</label>
        <input type="email" name="email" [(ngModel)]="userData.email" placeholder="esempio@testo.it" required>
      </div>

      <div class="form-group">
        <label>PASSWORD:</label>
        <div class="password-wrapper">
          <!-- Collegato ngModel e il tipo dinamico -->
          <input [type]="passwordVisible ? 'text' : 'password'" name="password" [(ngModel)]="userData.password" placeholder="Nuova password" required>
          <span class="toggle-password" (click)="togglePasswordVisibility()">
            {{ passwordVisible ? 'NASCONDI' : 'MOSTRA' }}
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>CONFERMA PASSWORD:</label>
        <div class="password-wrapper">
          <input [type]="confirmPasswordVisible ? 'text' : 'password'" name="confermaPassword" [(ngModel)]="userData.confermaPassword" placeholder="Conferma la tua password" required>
          <span class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
            {{ confirmPasswordVisible ? 'NASCONDI' : 'MOSTRA' }}
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit">Registrati ora</button>
    </form>
    
    <p class="login-link">Hai già un account? <a [routerLink]="['/login']">Accedi</a></p>
  </div>
</div>
